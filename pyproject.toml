[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tube-positioning"
version = "0.1.0"
description = "Vision-guided tubesheet mapping and operator positioning assist core"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.8",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
